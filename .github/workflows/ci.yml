name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          files = [p for p in pathlib.Path(".").rglob("*.py") if ".git" not in p.parts and "__pycache__" not in p.parts]
          if not files:
              raise SystemExit("No Python source files found")
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files")
          PY
